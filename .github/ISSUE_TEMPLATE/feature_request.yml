name: Idea or feature request
description: Suggest something VINAC Link should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The problem or situation, in your own words. How many computers, which agents, online or offline?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
  - type: textarea
    id: else
    attributes:
      label: Anything else?
